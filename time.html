</div>
  </div>

  <div id="timezone-menu" class="weather-menu region-menu">
    <div class="menu-title" data-lang-key="select_country">Оберіть країну:</div>
    <div class="menu-scroll-area">
      <button class="tz-opt" data-id="Ukraine" data-city-uk="Київ, Україна" data-city-en="Kyiv, Ukraine" data-city-pl="Kijów, Ukraina" data-tz="Europe/Kyiv">🇺🇦 Україна</button>
      <button class="tz-opt" data-id="UK" data-city-uk="Лондон, Великобританія" data-city-en="London, UK" data-city-pl="Londyn, Wielka Brytania" data-tz="Europe/London">🇬🇧 Great Britain</button>
      <button class="tz-opt" data-id="Poland" data-city-uk="Варшава, Польща" data-city-en="Warsaw, Poland" data-city-pl="Warszawa, Polska" data-tz="Europe/Warsaw">🇵🇱 Polska</button>
      <button class="tz-opt" data-id="USA" data-city-uk="Нью-Йорк, США" data-city-en="New York, USA" data-city-pl="Nowy Jork, USA" data-tz="America/New_York">🇺🇸 USA</button>
    </div>
  </div>

  <div id="language-menu" class="weather-menu lang-menu">
    <div class="menu-title" data-lang-key="select_lang">Оберіть мову:</div>
    <div class="menu-scroll-area">
      <button class="lang-opt" data-value="uk">🇺🇦 Українська</button>
      <button class="lang-opt" data-value="en">🇺🇸 English</button>
      <button class="lang-opt" data-value="pl">🇵🇱 Polski</button>
    </div>
  </div>

 <div class="clock-wrapper">
    <img src="moon.png" alt="Moon" class="moon-overlay">
    <img src="sun.png" alt="Sun" class="sun-overlay">

    <div class="clock-container">
      <div class="clock-label">Київ, Україна</div>
      <div id="ukraine-clock">00:00:00</div>
      <div id="ukraine-date">Завантаження...</div>

      <a href="#" target="_blank" class="weather-link-container" id="main-weather-link">
        <div class="weather-divider"></div>
        <div class="weather-content">
          <span id="current-city" class="weather-city">Київ:</span>
          <span id="current-temp" class="weather-temp">+7°C</span>
          <span class="weather-icon">☁️</span>
        </div>
      </a>
    </div>
  </div>

  <script src="clock.js" defer></script>
</body>
</html>
